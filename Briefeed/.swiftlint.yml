# SwiftLint configuration for Briefeed
# Prevents architecture violations that cause UI freezes

included:
  - Briefeed
  - BriefeedTests
  - BriefeedUITests

excluded:
  - build
  - DerivedData
  - .build
  - Pods

# Opt-in rules for better code quality
opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - closure_spacing
  - contains_over_filter_count
  - first_where
  - last_where
  - multiline_function_chains
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unused_import
  - vertical_whitespace_closing_braces
  - weak_delegate
  - yoda_condition

# Custom rules to prevent architecture violations
custom_rules:
  no_singleton_observable:
    name: "Singleton ObservableObject"
    regex: 'class\s+\w+.*ObservableObject.*\{[\s\S]*?static\s+let\s+shared'
    message: "Architecture violation: Don't mix Singleton with ObservableObject. Services should be plain singletons, ViewModels should be ObservableObject."
    severity: error
  
  no_published_in_service:
    name: "Published in Service"
    regex: '@Published.*class\s+\w*(Service|Manager|Controller)'
    message: "Architecture violation: Services shouldn't have @Published properties. Use ViewModels for UI state."
    severity: error
    
  no_value_await:
    name: "Task Value Await"
    regex: '\.value\s*\)?(?:\s*$|\s*[,\)])'
    message: "Performance issue: .value blocks thread. Use await directly or handle Task differently."
    severity: error

  heavy_init_check:
    name: "Heavy Init Work"
    regex: 'init\([^)]*\)\s*\{[^}]*?(load|fetch|setup|configure|Task\s*\{)'
    message: "Consider moving heavy work out of init() to an async initialize() method"
    severity: warning
    
  mainactor_service:
    name: "MainActor on Service"
    regex: '@MainActor\s+(final\s+)?class\s+\w*(Service|Manager|Controller)'
    message: "Services should not be @MainActor. Only ViewModels should use @MainActor."
    severity: error

# Rule configurations
force_unwrapping:
  severity: error

implicitly_unwrapped_optional:
  severity: error

line_length:
  warning: 120
  error: 200
  ignores_comments: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 40
  error: 80

cyclomatic_complexity:
  warning: 10
  error: 20

# Disable rules that conflict with our patterns
disabled_rules:
  - todo
  - fixme